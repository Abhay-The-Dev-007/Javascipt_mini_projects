<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
    <div id="container">
        <h1>Random Password Generator</h1>

            <input type="radio" id="chars1">
            <label for="chars1">Include Lowercase</label><br>

            <input type="radio" id="chars2">
            <label for="chars2">Include Uppercase</label><br>

            <input type="radio" id="chars3">
            <label for="chars3">Include Numbers</label><br>

            <input type="radio" id="chars4">
            <label for="chars4">Include Symbols</label><br><br>


        <button type="submit" id="mySubmit">Submit</button>

        <h2>Generated Password</h2>
        <p id="Passwordgenerated"></p>
    </div>
    </form>
    

    <script src="index.js"></script>
</body>
</html>
