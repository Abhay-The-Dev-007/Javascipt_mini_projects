<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider">
        <div class="slides">
            <img class="slide" src="images/briyani.avif" alt="img1">
            <img class="slide" src="images/cholebhature.jpg" alt="img2">
            <img class="slide" src="images/garlicPrawn.webp" alt="img3">
            <img class="slide" src="images/panna.jpg" alt="img4">
            <img class="slide" src="images/pho.jpg" alt="img5">
            <img class="slide" src="images/risotto.jpg" alt="img6">
        </div>
        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>
    </div>


    <script src="script.js"></script>
</body>
</html>
